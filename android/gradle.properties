org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
android.useAndroidX=true

# AGP 8.x supports up to JDK 21; this machine's default JDK is newer (Temurin 25), which AGP
# does not test against. Pin the toolchain explicitly so builds don't depend on which JDK
# happens to be active.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
